<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Merge Timeline</title>

  <style>
    :root {
      --bg: #050616;
      --panel: rgba(8, 10, 26, 0.92);
      --text: #F4F7FF;
      --muted: #9EA8D6;
      --et-blue: #2F5BFF;
      --et-magenta: #FF4FA3;
      --et-purple: #8D5CFF;
      --et-cyan: #58D7FF;
      --et-gradient: linear-gradient(135deg, var(--et-blue), var(--et-magenta));
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent !important;
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      padding: 16px;
    }

    .git-widget {
      width: min(100%, 1120px);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244, 247, 255, 0.12);
      border-radius: 24px;
      background:
        radial-gradient(circle at 18% 0%, rgba(47, 91, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 88% 16%, rgba(255, 79, 163, 0.18), transparent 30rem),
        linear-gradient(135deg, rgba(4, 6, 22, 0.98), rgba(10, 8, 27, 0.98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    .git-widget::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.022) 50%, rgba(0,0,0,0.035) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.014), rgba(0,255,0,0.008), rgba(0,0,255,0.014));
      background-size: 100% 4px, 6px 100%;
      opacity: 0.32;
      mix-blend-mode: screen;
      z-index: 10;
    }

    .terminal-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(244, 247, 255, 0.11);
      background: linear-gradient(180deg, rgba(22, 25, 52, 0.92), rgba(8, 10, 28, 0.92));
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .dots {
      display: inline-flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
    }

    .dot:nth-child(1) { background: #ff5f56; }
    .dot:nth-child(2) { background: #ffbd2e; }
    .dot:nth-child(3) { background: #27c93f; }

    .terminal-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .hero {
      padding: clamp(20px, 4vw, 40px) clamp(18px, 5vw, 56px) 10px;
    }

    .prompt {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
    }

    .prompt strong {
      color: transparent;
      background: var(--et-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      font-weight: 700;
    }

    .prompt span { color: var(--et-cyan); }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: -0.18em;
      background: var(--et-gradient);
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(28px, 5vw, 58px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      color: transparent;
      background: var(--et-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 79, 163, 0.18);
    }

    .subtitle {
      margin: 16px 0 0;
      max-width: 760px;
      min-height: 1px;
      color: #BEC6F5;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.7;
    }

    .timeline {
      position: relative;
      padding: 34px clamp(14px, 5vw, 56px) 56px;
    }

    .timeline-canvas {
      position: relative;
    }

    .main-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(47,91,255,0.36),
        rgba(255,79,163,0.82),
        rgba(47,91,255,0.36),
        transparent
      );
      box-shadow:
        0 0 30px rgba(255, 79, 163, 0.34),
        0 0 42px rgba(47, 91, 255, 0.18);
      z-index: 0;
    }

    .main-line::before,
    .main-line::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 2px solid transparent;
      background:
        linear-gradient(#07091d, #07091d) padding-box,
        var(--et-gradient) border-box;
      box-shadow:
        0 0 20px rgba(255, 79, 163, 0.72),
        0 0 28px rgba(47, 91, 255, 0.42);
    }

    .main-line::before { top: 0; }
    .main-line::after { bottom: 0; }

    .merge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 1;
    }

    .merge-path {
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px var(--branch-color));
      opacity: 0.92;
      stroke-dasharray: var(--path-length);
      stroke-dashoffset: var(--path-length);
      animation: drawPath 650ms ease forwards;
    }

    @keyframes drawPath { to { stroke-dashoffset: 0; } }

    .timeline-list {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 14px;
    }

    .event {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px minmax(0, 1fr);
      gap: 28px;
      align-items: center;
      min-height: 86px;
      padding: 22px 0;
      transition: min-height 220ms ease, padding 220ms ease;
    }

    .event.is-active {
      min-height: 330px;
      padding: 34px 0;
    }

    .date-node {
      position: relative;
      grid-column: 2;
      justify-self: center;
      width: 96px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 999px;
      background:
        linear-gradient(#07091d, #07091d) padding-box,
        var(--et-gradient) border-box;
      color: #F4F7FF;
      box-shadow:
        0 0 0 6px rgba(47, 91, 255, 0.08),
        0 0 28px rgba(255, 79, 163, 0.36),
        0 0 34px rgba(47, 91, 255, 0.24);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      appearance: none;
      z-index: 5;
    }

    .date-node::after {
      content: "merge";
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.78;
      pointer-events: none;
    }

    .date-node:hover,
    .date-node:focus-visible,
    .date-node[aria-expanded="true"] {
      outline: none;
      box-shadow:
        0 0 0 6px rgba(47, 91, 255, 0.12),
        0 0 30px rgba(255, 79, 163, 0.48),
        0 0 42px rgba(47, 91, 255, 0.34);
    }

    .date-tooltip {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      width: max-content;
      max-width: 280px;
      transform: translateX(-50%) translateY(6px);
      padding: 8px 11px;
      border: 1px solid rgba(244, 247, 255, 0.14);
      border-radius: 12px;
      background: rgba(7, 9, 29, 0.96);
      color: #F4F7FF;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: 160ms ease;
      z-index: 9;
    }

    .date-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -5px) rotate(45deg);
      background: rgba(7, 9, 29, 0.96);
      border-right: 1px solid rgba(244, 247, 255, 0.14);
      border-bottom: 1px solid rgba(244, 247, 255, 0.14);
    }

    .date-node:hover .date-tooltip,
    .date-node:focus-visible .date-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .card-slot {
      display: none;
      min-width: 0;
    }

    .event.is-active .card-slot {
      display: block;
    }

    .card-slot.left {
      grid-column: 1;
      grid-row: 1;
    }

    .card-slot.right {
      grid-column: 3;
      grid-row: 1;
    }

    .experience-card {
      width: 100%;
      border: 1px solid rgba(244, 247, 255, 0.13);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)),
        var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      padding: 16px;
      overflow: hidden;
      opacity: 0;
      transform: translateX(var(--card-offset, 0));
      animation: cardIn 260ms cubic-bezier(.2,.8,.2,1) forwards;
      transition: 180ms ease;
      position: relative;
    }

    .card-slot.left .experience-card { --card-offset: -14px; }
    .card-slot.right .experience-card { --card-offset: 14px; }

    .experience-card:hover {
      border-color: var(--branch-color);
      box-shadow:
        0 20px 58px rgba(0, 0, 0, 0.44),
        0 0 24px rgba(255, 79, 163, 0.18);
    }

    .experience-card::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--branch-color);
      box-shadow: 0 0 20px var(--branch-color);
    }

    .card-slot.left .experience-card::before { right: 0; }
    .card-slot.right .experience-card::before { left: 0; }

    @keyframes cardIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .card-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .branch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--branch-color);
      border: 1px solid rgba(244, 247, 255, 0.13);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
    }

    .branch::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--branch-color);
      box-shadow: 0 0 10px var(--branch-color);
    }

    .hash { color: var(--et-magenta); }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--branch-color);
      color: #040616;
      font-weight: 800;
    }

    .experience-card h2 {
      margin: 0 0 8px;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .company {
      margin: 0 0 8px;
      color: #E7EAFF;
      font-weight: 700;
    }

    .description {
      margin: 0;
      color: #BEC6F5;
      font-size: 14px;
      line-height: 1.58;
    }

    .card-media { margin: 12px 0; }

    .card-image {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(244, 247, 255, 0.12);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 10px 28px rgba(0,0,0,0.20);
    }

    .image-placeholder {
      width: 100%;
      min-height: 130px;
      border-radius: 14px;
      border: 1.5px dashed rgba(255, 79, 163, 0.38);
      background:
        linear-gradient(135deg, rgba(47, 91, 255, 0.12), rgba(255, 79, 163, 0.12)),
        rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      padding: 16px;
      color: #C9D2FF;
    }

    .image-placeholder span {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .image-placeholder small {
      display: block;
      max-width: 250px;
      line-height: 1.5;
      color: var(--muted);
    }

    .image-placeholder code {
      font-family: var(--mono);
      color: #F4F7FF;
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .commands {
      display: grid;
      gap: 4px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(244, 247, 255, 0.09);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
    }

    .commands span::before {
      content: "$ ";
      color: var(--et-magenta);
    }

    .footer {
      padding: 14px clamp(18px, 5vw, 56px) 22px;
      border-top: 1px solid rgba(244, 247, 255, 0.09);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
    }

    .footer strong { color: #F4F7FF; }

    @media (max-width: 780px) {
      body { padding: 10px; }
      .hero { padding-bottom: 0; }
      .timeline { padding-left: 14px; padding-right: 14px; }
      .main-line { left: 34px; }
      .timeline-list { gap: 6px; }
      .event,
      .event.is-active {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 14px;
        min-height: 76px;
        padding: 18px 0;
        align-items: center;
      }
      .event.is-active { min-height: 320px; }
      .date-node {
        grid-column: 1;
        width: 68px;
        height: 34px;
        font-size: 11px;
      }
      .date-node::after { display: none; }
      .date-tooltip {
        left: calc(100% + 12px);
        bottom: 50%;
        transform: translateY(50%) translateX(-6px);
        text-align: left;
      }
      .date-tooltip::after {
        top: 50%;
        left: -5px;
        transform: translateY(-50%) rotate(45deg);
        border: 0;
        border-left: 1px solid rgba(244, 247, 255, 0.14);
        border-bottom: 1px solid rgba(244, 247, 255, 0.14);
      }
      .date-node:hover .date-tooltip,
      .date-node:focus-visible .date-tooltip {
        transform: translateY(50%) translateX(0);
      }
      .card-slot.left,
      .card-slot.right {
        grid-column: 2;
        grid-row: 1;
      }
      .card-slot.left .experience-card::before,
      .card-slot.right .experience-card::before {
        left: 0;
        right: auto;
      }
      .commands { display: none; }
    }

    @media (max-width: 460px) {
      body { padding: 8px; }
      .terminal-head { height: 38px; font-size: 10px; }
      .terminal-head > span:last-child { display: none; }
      .hero { padding-left: 14px; padding-right: 14px; }
      .timeline { padding-left: 10px; padding-right: 10px; }
      .main-line { left: 28px; }
      .event,
      .event.is-active {
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 10px;
      }
      .date-node {
        width: 56px;
        height: 30px;
      }
      .experience-card { padding: 14px; }
      .card-top { font-size: 10px; }
      .card-image,
      .image-placeholder { height: 125px; min-height: 125px; }
    }
  </style>
</head>

    const timelineCanvas = document.getElementById("timelineCanvas");
    const mergeSvg = document.getElementById("mergeSvg");
    const eventsLayer = document.getElementById("eventsLayer");

    let activeIndex = null;

    function isMobile() {
      return window.innerWidth <= 780;
    }

    function sideFor(index) {
      if (isMobile()) return "right";
      return index % 2 === 0 ? "left" : "right";
    }

    function getMediaMarkup(item) {
      if (item.image) {
        return `<img src="${item.image}" alt="${item.title}" class="card-image" loading="lazy" />`;
      }

      return `
        <div class="image-placeholder">
          <span>Image</span>
          <small>Ajoute une URL dans <code>image: "..."</code></small>
        </div>
      `;
    }

    function createSvgPath(d, color) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      path.classList.add("merge-path");
      path.style.setProperty("--branch-color", color);
      mergeSvg.appendChild(path);

      const length = Math.ceil(path.getTotalLength());
      path.style.setProperty("--path-length", length);
    }

    function drawActiveMergePath() {
      mergeSvg.innerHTML = "";

      if (activeIndex === null) return;

      const activeRow = eventsLayer.querySelector(`[data-index="${activeIndex}"]`);
      if (!activeRow) return;

      const card = activeRow.querySelector(".experience-card");
      const dateNode = activeRow.querySelector(".date-node");
      if (!card || !dateNode) return;

      const canvasRect = timelineCanvas.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const dateRect = dateNode.getBoundingClientRect();
      const side = sideFor(activeIndex);

      const y = dateRect.top + dateRect.height / 2 - canvasRect.top;
      const dateX = dateRect.left + dateRect.width / 2 - canvasRect.left;
      const cardX = isMobile()
        ? cardRect.left - canvasRect.left
        : side === "left"
          ? cardRect.right - canvasRect.left
          : cardRect.left - canvasRect.left;

      const controlOffset = isMobile() ? 34 : 86;
      const c1 = side === "left" ? cardX + controlOffset : cardX - controlOffset;
      const c2 = side === "left" ? dateX - controlOffset : dateX + controlOffset;

      const d = `M ${cardX} ${y} C ${c1} ${y}, ${c2} ${y}, ${dateX} ${y}`;
      const color = experiences[activeIndex].color || (activeIndex % 2 === 0 ? "#2F5BFF" : "#FF4FA3");

      createSvgPath(d, color);
    }

    function render() {
      eventsLayer.innerHTML = "";
      mergeSvg.innerHTML = "";

      experiences.forEach((item, index) => {
        const side = sideFor(index);
        const color = item.color || (index % 2 === 0 ? "#2F5BFF" : "#FF4FA3");
        const isActive = activeIndex === index;

        const event = document.createElement("article");
        event.className = `event ${isActive ? "is-active" : ""}`;
        event.dataset.index = String(index);
        event.style.setProperty("--branch-color", color);

        event.innerHTML = `
          <button class="date-node" type="button" aria-expanded="${isActive}" aria-label="${item.date} — ${item.title}">
            ${item.date}
            <span class="date-tooltip">${item.title}</span>
          </button>

          <div class="card-slot ${side}">
            <div class="experience-card" style="--branch-color:${color}">
              <div class="card-top">
                <span class="branch">${item.branch}</span>
                <span class="hash">${item.hash}</span>
                <span class="tag">${item.tag}</span>
              </div>

              <h2>${item.title}</h2>
              <p class="company">${item.company}</p>

              <div class="card-media">
                ${getMediaMarkup(item)}
              </div>

              <p class="description">${item.description}</p>

              <div class="commands">
                ${(item.commands || []).map(command => `<span>${command}</span>`).join("")}
              </div>
            </div>
          </div>
        `;

        event.querySelector(".date-node").addEventListener("click", () => {
          activeIndex = activeIndex === index ? null : index;
          render();

          requestAnimationFrame(() => {
            const openedRow = eventsLayer.querySelector(`[data-index="${index}"]`);
            if (activeIndex === index && openedRow) {
              openedRow.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          });
        });

        eventsLayer.appendChild(event);
      });

      requestAnimationFrame(drawActiveMergePath);
    }

    let resizeTimer;
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        render();
      }, 120);
    });

    render();
  </script>
