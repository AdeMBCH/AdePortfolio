<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Merge Timeline — Wheel</title>

  <style>
    :root {
      --panel: rgba(8, 10, 26, 0.92);
      --text: #F4F7FF;
      --muted: #9EA8D6;
      --et-blue: #2F5BFF;
      --et-magenta: #FF4FA3;
      --et-purple: #8D5CFF;
      --et-cyan: #58D7FF;
      --et-gradient: linear-gradient(135deg, var(--et-blue), var(--et-magenta));
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent !important;
      color: var(--text);
      font-family: var(--sans);
    }

    body { padding: 16px; }

    .git-widget {
      width: min(100%, 1120px);
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244, 247, 255, 0.12);
      border-radius: 24px;
      background:
        radial-gradient(circle at 18% 0%, rgba(47, 91, 255, 0.22), transparent 34rem),
        radial-gradient(circle at 88% 16%, rgba(255, 79, 163, 0.18), transparent 30rem),
        linear-gradient(135deg, rgba(4, 6, 22, 0.98), rgba(10, 8, 27, 0.98));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
    }

    .git-widget::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.018) 50%, rgba(0,0,0,0.03) 50%),
        linear-gradient(90deg, rgba(255,0,0,0.012), rgba(0,255,0,0.006), rgba(0,0,255,0.012));
      background-size: 100% 4px, 6px 100%;
      opacity: 0.26;
      mix-blend-mode: screen;
      z-index: 30;
    }

    .terminal-head {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(244, 247, 255, 0.11);
      background: linear-gradient(180deg, rgba(22, 25, 52, 0.92), rgba(8, 10, 28, 0.92));
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .dots { display: inline-flex; gap: 8px; flex: 0 0 auto; }
    .dot { width: 11px; height: 11px; border-radius: 999px; }
    .dot:nth-child(1) { background: #ff5f56; }
    .dot:nth-child(2) { background: #ffbd2e; }
    .dot:nth-child(3) { background: #27c93f; }

    .terminal-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .hero {
      padding: clamp(20px, 4vw, 40px) clamp(18px, 5vw, 56px) 6px;
    }

    .prompt {
      margin: 0 0 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
    }

    .prompt strong {
      color: transparent;
      background: var(--et-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      font-weight: 700;
    }

    .prompt span { color: var(--et-cyan); }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: -0.18em;
      background: var(--et-gradient);
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(28px, 5vw, 58px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      color: transparent;
      background: var(--et-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 79, 163, 0.18);
    }

    .subtitle {
      margin: 14px 0 0;
      max-width: 780px;
      color: #BEC6F5;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.7;
    }

    .timeline {
      position: relative;
      padding: 18px clamp(14px, 5vw, 56px) 38px;
    }

    .timeline-canvas {
      --center-x: 50%;
      position: relative;
      height: 560px;
      overflow: hidden;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      border-radius: 18px;
    }

    .timeline-canvas::before,
    .timeline-canvas::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 92px;
      z-index: 18;
      pointer-events: none;
    }

    .timeline-canvas::before {
      top: 0;
      background: linear-gradient(180deg, rgba(5, 6, 22, 0.92), transparent);
    }

    .timeline-canvas::after {
      bottom: 0;
      background: linear-gradient(0deg, rgba(5, 6, 22, 0.92), transparent);
    }

    .main-line {
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: var(--center-x);
      width: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(47,91,255,0.36), rgba(255,79,163,0.82), rgba(47,91,255,0.36), transparent);
      box-shadow: 0 0 30px rgba(255, 79, 163, 0.34), 0 0 42px rgba(47, 91, 255, 0.18);
      z-index: 0;
    }

    .wheel-backplate {
      position: absolute;
      left: var(--center-x);
      top: 50%;
      width: 190px;
      height: 470px;
      transform: translate(-50%, -50%) rotateX(64deg);
      border-radius: 999px;
      border: 1px solid rgba(244, 247, 255, 0.08);
      background: radial-gradient(ellipse at center, rgba(255, 79, 163, 0.08), rgba(47, 91, 255, 0.025) 48%, transparent 72%);
      box-shadow: inset 0 0 36px rgba(255, 79, 163, 0.08), 0 0 52px rgba(47, 91, 255, 0.08);
      z-index: 0;
      pointer-events: none;
    }

    .merge-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 6;
    }

    .merge-path {
      fill: none;
      stroke: var(--branch-color);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px var(--branch-color));
      opacity: 0.95;
      stroke-dasharray: var(--path-length);
      stroke-dashoffset: var(--path-length);
      animation: drawPath 460ms ease forwards;
    }

    @keyframes drawPath { to { stroke-dashoffset: 0; } }

    .wheel-node {
      position: absolute;
      left: var(--center-x);
      top: 50%;
      width: 96px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 999px;
      background: linear-gradient(#07091d, #07091d) padding-box, var(--et-gradient) border-box;
      color: #F4F7FF;
      box-shadow: 0 0 0 6px rgba(47, 91, 255, 0.08), 0 0 28px rgba(255, 79, 163, 0.36), 0 0 34px rgba(47, 91, 255, 0.24);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      appearance: none;
      transform: translate(-50%, -50%) translateY(var(--wheel-y)) translateZ(var(--wheel-z)) rotateX(var(--wheel-rotate)) scale(var(--wheel-scale));
      transform-origin: center center;
      opacity: var(--wheel-opacity);
      filter: blur(var(--wheel-blur));
      z-index: var(--wheel-z-index);
      pointer-events: auto;
      transition: transform 560ms cubic-bezier(.16,.9,.24,1), opacity 360ms ease, filter 360ms ease, box-shadow 160ms ease;
    }

    .wheel-node.is-active {
      box-shadow: 0 0 0 7px rgba(47, 91, 255, 0.12), 0 0 34px rgba(255, 79, 163, 0.56), 0 0 46px rgba(47, 91, 255, 0.36);
    }

    .wheel-node.is-hidden {
      pointer-events: none;
      visibility: hidden;
    }

    .wheel-node::after {
      content: "merge";
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.74;
      pointer-events: none;
    }

    .wheel-node:not(.is-active)::after { opacity: 0; }

    .wheel-node:hover,
    .wheel-node:focus-visible {
      outline: none;
      box-shadow: 0 0 0 7px rgba(47, 91, 255, 0.12), 0 0 34px rgba(255, 79, 163, 0.50), 0 0 46px rgba(47, 91, 255, 0.34);
    }

    .date-tooltip {
      position: absolute;
      bottom: calc(100% + 14px);
      left: 50%;
      width: max-content;
      max-width: 280px;
      transform: translateX(-50%) translateY(6px);
      padding: 8px 11px;
      border: 1px solid rgba(244, 247, 255, 0.14);
      border-radius: 12px;
      background: rgba(7, 9, 29, 0.96);
      color: #F4F7FF;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: 160ms ease;
      z-index: 60;
    }

    .date-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -5px) rotate(45deg);
      background: rgba(7, 9, 29, 0.96);
      border-right: 1px solid rgba(244, 247, 255, 0.14);
      border-bottom: 1px solid rgba(244, 247, 255, 0.14);
    }

    .wheel-node:hover .date-tooltip,
    .wheel-node:focus-visible .date-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .active-card-slot {
      position: absolute;
      top: 50%;
      width: min(42%, 430px);
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: auto;
    }

    .active-card-slot.left { left: 0; }
    .active-card-slot.right { right: 0; }

    .experience-card {
      width: 100%;
      max-height: 430px;
      overflow: hidden;
      border: 1px solid rgba(244, 247, 255, 0.13);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018)), var(--panel);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      padding: 16px;
      opacity: 0;
      transform: translateX(var(--card-offset, 0)) scale(0.96);
      animation: cardIn 280ms cubic-bezier(.2,.8,.2,1) forwards;
      transition: 180ms ease;
      position: relative;
    }

    .active-card-slot.left .experience-card { --card-offset: -16px; }
    .active-card-slot.right .experience-card { --card-offset: 16px; }

    .experience-card:hover {
      border-color: var(--branch-color);
      box-shadow: 0 20px 58px rgba(0, 0, 0, 0.44), 0 0 24px rgba(255, 79, 163, 0.18);
    }

    .experience-card::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--branch-color);
      box-shadow: 0 0 20px var(--branch-color);
    }

    .active-card-slot.left .experience-card::before { right: 0; }
    .active-card-slot.right .experience-card::before { left: 0; }

    @keyframes cardIn {
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .card-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .branch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--branch-color);
      border: 1px solid rgba(244, 247, 255, 0.13);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px 8px;
    }

    .branch::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--branch-color);
      box-shadow: 0 0 10px var(--branch-color);
    }

    .hash { color: var(--et-magenta); }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--branch-color);
      color: #040616;
      font-weight: 800;
    }

    .experience-card h2 {
      margin: 0 0 8px;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .company {
      margin: 0 0 8px;
      color: #E7EAFF;
      font-weight: 700;
    }

    .description {
      margin: 0;
      color: #BEC6F5;
      font-size: 14px;
      line-height: 1.58;
    }

    .card-media { margin: 12px 0; }

    .card-image {
      display: block;
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(244, 247, 255, 0.12);
      background: rgba(255,255,255,0.04);
      box-shadow: 0 10px 28px rgba(0,0,0,0.20);
    }

    .commands {
      display: grid;
      gap: 4px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(244, 247, 255, 0.09);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
    }

    .commands span::before {
      content: "$ ";
      color: var(--et-magenta);
    }

    .wheel-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      position: relative;
      z-index: 12;
    }

    .wheel-btn {
      appearance: none;
      border: 1px solid rgba(244, 247, 255, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 160ms ease;
    }

    .wheel-btn:hover:not(:disabled) {
      border-color: rgba(255, 79, 163, 0.6);
      background: rgba(255, 79, 163, 0.12);
    }

    .wheel-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .footer {
      padding: 14px clamp(18px, 5vw, 56px) 22px;
      border-top: 1px solid rgba(244, 247, 255, 0.09);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
    }

    .footer strong { color: #F4F7FF; }

    @media (max-width: 780px) {
      body { padding: 10px; }
      .hero { padding-bottom: 0; }
      .timeline { padding-left: 14px; padding-right: 14px; }
      .timeline-canvas { --center-x: 34px; height: 520px; }
      .wheel-backplate { left: 34px; width: 120px; }
      .main-line { left: 34px; }
      .wheel-node { width: 68px; height: 34px; font-size: 11px; }
      .wheel-node::after { display: none; }
      .date-tooltip {
        left: calc(100% + 12px);
        bottom: 50%;
        transform: translateY(50%) translateX(-6px);
        text-align: left;
      }
      .date-tooltip::after {
        top: 50%;
        left: -5px;
        transform: translateY(-50%) rotate(45deg);
        border: 0;
        border-left: 1px solid rgba(244, 247, 255, 0.14);
        border-bottom: 1px solid rgba(244, 247, 255, 0.14);
      }
      .wheel-node:hover .date-tooltip,
      .wheel-node:focus-visible .date-tooltip {
        transform: translateY(50%) translateX(0);
      }
      .active-card-slot.left,
      .active-card-slot.right {
        left: 82px;
        right: auto;
        width: calc(100% - 82px);
      }
      .active-card-slot.left .experience-card::before,
      .active-card-slot.right .experience-card::before {
        left: 0;
        right: auto;
      }
      .commands { display: none; }
    }

    @media (max-width: 460px) {
      body { padding: 8px; }
      .terminal-head { height: 38px; font-size: 10px; }
      .terminal-head > span:last-child { display: none; }
      .hero { padding-left: 14px; padding-right: 14px; }
      .timeline { padding-left: 10px; padding-right: 10px; }
      .timeline-canvas { --center-x: 28px; height: 500px; }
      .main-line { left: 28px; }
      .wheel-backplate { left: 28px; width: 100px; }
      .wheel-node { width: 56px; height: 30px; }
      .active-card-slot.left,
      .active-card-slot.right {
        left: 66px;
        width: calc(100% - 66px);
      }
      .experience-card { padding: 14px; }
      .card-top { font-size: 10px; }
      .card-image { height: 112px; }
    }
  </style>
</head>

      { date: `2025`, title: `Stage au Japon sur un robot poisson`, company: `Tokyo University of Science`, branch: `robotics/fish-robot`, color: `#2F5BFF`, tag: `internship`, hash: `2025jpn`, image: ``, description: `Stage à Tokyo University of Science au Japon autour d’un robot poisson, à l’interface entre robotique bio-inspirée, recherche appliquée et expérimentation.`, commands: [`git checkout -b robotics/fish-robot`, `git commit -m 'Tokyo University of Science internship'`] },
      { date: `2025`, title: `Entrée à l’ENSTA en double diplôme`, company: `ENSTA`, branch: `education/ensta`, color: `#FF4FA3`, tag: `double degree`, hash: `2025ens`, image: ``, description: `Entrée à l’ENSTA dans le cadre d’un double diplôme, en continuité d’un parcours d’ingénierie à forte densité scientifique et technologique.`, commands: [`git checkout -b education/ensta`, `git merge education/seatech`] },
      { date: `2025`, title: `Projet robot poisson`, company: `Projet robotique`, branch: `project/fish-robot`, color: `#8D5CFF`, tag: `project`, hash: `2025fsh`, image: ``, description: `Développement et approfondissement d’un projet de robot poisson, dans la continuité du stage au Japon et des travaux en robotique bio-inspirée.`, commands: [`git checkout -b project/fish-robot`, `git merge robotics/fish-robot`] },
      { date: `2026`, title: `Professeur — Cours de ROS`, company: `Transmission / pédagogie`, branch: `teaching/ros`, color: `#2F5BFF`, tag: `teaching`, hash: `2026ros`, image: ``, description: `Enseignement de cours de ROS, avec transmission de compétences en architecture logicielle robotique, middleware et développement de systèmes autonomes.`, commands: [`git checkout -b teaching/ros`, `git commit -m 'teach ROS courses'`] },
      { date: `2026`, title: `Jury du concours de la nouvelle CROUS`, company: `CROUS`, branch: `writing/jury`, color: `#FF4FA3`, tag: `jury`, hash: `2026crs`, image: ``, description: `Participation comme jury au concours de la nouvelle du CROUS, avec un rôle d’évaluation et de sélection de productions littéraires.`, commands: [`git checkout -b writing/jury`, `git merge writing/award`] },
      { date: `2026`, title: `Coupe de France de Robotique`, company: `Compétition robotique`, branch: `robotics/france-cup`, color: `#8D5CFF`, tag: `competition`, hash: `2026cdf`, image: ``, description: `Participation à la Coupe de France de Robotique, dans la continuité d’un parcours fortement ancré dans la robotique compétitive.`, commands: [`git checkout -b robotics/france-cup`, `git merge robotics/robocup`] }
    ];

    const timelineCanvas = document.getElementById(`timelineCanvas`);
    const mergeSvg = document.getElementById(`mergeSvg`);
    const wheelLayer = document.getElementById(`wheelLayer`);
    const activeCardLayer = document.getElementById(`activeCardLayer`);
    const prevBtn = document.getElementById(`prevBtn`);
    const nextBtn = document.getElementById(`nextBtn`);

    let activeIndex = 0;
    let previousIndex = 0;
    let wheelNodes = [];

    function isMobile() {
      return window.innerWidth <= 780;
    }

    function sideFor(index) {
      if (isMobile()) return `right`;
      return index % 2 === 0 ? `left` : `right`;
    }

    function mediaMarkup(item) {
      if (!item.image) return ``;

      return `
        <div class="card-media">
          <img src="${item.image}" alt="${item.title}" class="card-image" loading="lazy" />
        </div>
      `;
    }

    function wheelStyle(delta) {
      const abs = Math.abs(delta);
      const sign = Math.sign(delta) || 1;
      const step = isMobile() ? 76 : 90;

      if (abs === 0) {
        return { y: 0, z: 130, scale: 1, opacity: 1, blur: 0, rotate: 0, zIndex: 40, hidden: false };
      }

      if (abs === 1) {
        return { y: sign * step, z: 38, scale: 0.82, opacity: 0.7, blur: 0, rotate: sign * -22, zIndex: 30, hidden: false };
      }

      if (abs === 2) {
        return { y: sign * step * 1.68, z: -82, scale: 0.62, opacity: 0.36, blur: 0.45, rotate: sign * -42, zIndex: 20, hidden: false };
      }

      if (abs === 3) {
        return { y: sign * step * 2.18, z: -210, scale: 0.44, opacity: 0.13, blur: 0.9, rotate: sign * -58, zIndex: 10, hidden: false };
      }

      return { y: sign * step * 2.65, z: -330, scale: 0.28, opacity: 0, blur: 1.6, rotate: sign * -72, zIndex: 0, hidden: true };
    }

    function cardMarkup(item, side, color) {
      return `
        <div class="active-card-slot ${side}">
          <div class="experience-card" style="--branch-color:${color}">
            <div class="card-top">
              <span class="branch">${item.branch}</span>
              <span class="hash">${item.hash}</span>
              <span class="tag">${item.tag}</span>
            </div>
            <h2>${item.title}</h2>
            <p class="company">${item.company}</p>
            ${mediaMarkup(item)}
            <p class="description">${item.description}</p>
            <div class="commands">${(item.commands || []).map(command => `<span>${command}</span>`).join(``)}</div>
          </div>
        </div>
      `;
    }

    function createSvgPath(d, color) {
      const path = document.createElementNS(`http://www.w3.org/2000/svg`, `path`);
      path.setAttribute(`d`, d);
      path.classList.add(`merge-path`);
      path.style.setProperty(`--branch-color`, color);
      mergeSvg.appendChild(path);
      const length = Math.ceil(path.getTotalLength());
      path.style.setProperty(`--path-length`, length);
    }

    function drawActiveMergePath() {
      mergeSvg.innerHTML = ``;

      const card = activeCardLayer.querySelector(`.experience-card`);
      const dateNode = wheelLayer.querySelector(`.wheel-node.is-active`);
      if (!card || !dateNode) return;

      const canvasRect = timelineCanvas.getBoundingClientRect();
      const cardRect = card.getBoundingClientRect();
      const dateRect = dateNode.getBoundingClientRect();
      const side = sideFor(activeIndex);
      const y = dateRect.top + dateRect.height / 2 - canvasRect.top;
      const dateX = dateRect.left + dateRect.width / 2 - canvasRect.left;
      const cardX = isMobile()
        ? cardRect.left - canvasRect.left
        : side === `left`
          ? cardRect.right - canvasRect.left
          : cardRect.left - canvasRect.left;
      const controlOffset = isMobile() ? 34 : 86;
      const c1 = side === `left` ? cardX + controlOffset : cardX - controlOffset;
      const c2 = side === `left` ? dateX - controlOffset : dateX + controlOffset;
      const d = `M ${cardX} ${y} C ${c1} ${y}, ${c2} ${y}, ${dateX} ${y}`;
      const color = experiences[activeIndex].color || (activeIndex % 2 === 0 ? `#2F5BFF` : `#FF4FA3`);
      createSvgPath(d, color);
    }

    function mountWheel() {
      wheelLayer.innerHTML = ``;
      wheelNodes = experiences.map((item, index) => {
        const node = document.createElement(`button`);
        node.type = `button`;
        node.className = `wheel-node`;
        node.setAttribute(`aria-label`, `${item.date} — ${item.title}`);
        node.innerHTML = `${item.date}<span class="date-tooltip">${item.title}</span>`;
        node.addEventListener(`click`, () => setActive(index));
        wheelLayer.appendChild(node);
        return node;
      });
    }

    function updateWheel() {
      wheelNodes.forEach((node, index) => {
        const delta = index - activeIndex;
        const metrics = wheelStyle(delta);
        const item = experiences[index];
        const color = item.color || (index % 2 === 0 ? `#2F5BFF` : `#FF4FA3`);

        node.classList.toggle(`is-active`, index === activeIndex);
        node.classList.toggle(`is-hidden`, metrics.hidden);
        node.setAttribute(`aria-expanded`, index === activeIndex ? `true` : `false`);
        node.style.setProperty(`--branch-color`, color);
        node.style.setProperty(`--wheel-y`, `${metrics.y}px`);
        node.style.setProperty(`--wheel-z`, `${metrics.z}px`);
        node.style.setProperty(`--wheel-scale`, metrics.scale);
        node.style.setProperty(`--wheel-opacity`, metrics.opacity);
        node.style.setProperty(`--wheel-blur`, `${metrics.blur}px`);
        node.style.setProperty(`--wheel-rotate`, `${metrics.rotate}deg`);
        node.style.setProperty(`--wheel-z-index`, metrics.zIndex);
      });
    }

    function renderCard() {
      const active = experiences[activeIndex];
      const side = sideFor(activeIndex);
      const color = active.color || (activeIndex % 2 === 0 ? `#2F5BFF` : `#FF4FA3`);
      activeCardLayer.innerHTML = cardMarkup(active, side, color);
    }

    function updateControls() {
      prevBtn.disabled = activeIndex === 0;
      nextBtn.disabled = activeIndex === experiences.length - 1;
    }

    function setActive(index) {
      const nextIndex = Math.max(0, Math.min(experiences.length - 1, index));
      if (nextIndex === activeIndex) return;

      previousIndex = activeIndex;
      activeIndex = nextIndex;

      updateWheel();
      renderCard();
      updateControls();
      requestAnimationFrame(drawActiveMergePath);
      window.setTimeout(drawActiveMergePath, 590);
    }

    function runRuntimeTests() {
      console.assert(typeof wheelStyle === `function`, `wheelStyle must be defined`);
      console.assert(wheelStyle(0).hidden === false, `active wheel node must be visible`);
      console.assert(wheelStyle(1).y > 0, `next wheel node must be below the active node`);
      console.assert(wheelStyle(-1).y < 0, `previous wheel node must be above the active node`);
      console.assert(mediaMarkup({ image: `` }) === ``, `empty image must render no media block`);
    }

    function render() {
      if (!wheelNodes.length) mountWheel();
      updateWheel();
      renderCard();
      updateControls();
      requestAnimationFrame(drawActiveMergePath);
    }

    prevBtn.addEventListener(`click`, () => setActive(activeIndex - 1));
    nextBtn.addEventListener(`click`, () => setActive(activeIndex + 1));

    let resizeTimer;
    window.addEventListener(`resize`, () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        renderCard();
        updateWheel();
        requestAnimationFrame(drawActiveMergePath);
      }, 120);
    });

    runRuntimeTests();
    render();
  </script>
</body>
